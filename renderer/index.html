<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' data:">
  <title>FocusDock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <svg class="isolines" aria-hidden="true" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice"></svg>
      <div class="top-row">
        <h1 class="date" id="date"></h1>
        <div class="top-actions">
          <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings"></button>
          <button class="icon-btn" id="btn-hide" title="Hide panel (tray icon brings it back)" aria-label="Hide panel"></button>
        </div>
      </div>
      <div class="colorbar" id="colorbar" role="img"></div>
      <div class="bar-legend">
        <span id="today-count"></span>
        <span id="streak"></span>
      </div>
      <div class="level" id="level"></div>
    </header>

    <div id="notices"></div>
    <section id="inbox" class="inbox" aria-live="polite"></section>

    <main id="view-tasks" class="view">
      <section id="spotlight" class="spotlight"></section>

      <form id="capture" class="capture" autocomplete="off">
        <div class="capture-field">
          <span class="capture-plus" aria-hidden="true"></span>
          <input id="capture-input" type="text" placeholder="Add a task" aria-label="Add a task" maxlength="300">
        </div>
        <div class="capture-more" id="capture-more">
          <div class="seg prio-seg" id="capture-prio" role="radiogroup" aria-label="Priority"></div>
          <div class="due-row" id="capture-due"></div>
          <p class="hint">Shortcuts while typing: <b>!1</b> to <b>!4</b> for priority, <b>@fri</b>, <b>@15.11</b>, <b>@3d</b> or <b>@14:00</b> for a deadline. <b>Enter</b> adds.</p>
        </div>
      </form>

      <section id="list" class="list"></section>
    </main>

    <main id="view-history" class="view" hidden>
      <section id="history-stats" class="history-stats"></section>
      <section id="history" class="list history"></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-tasks" aria-selected="true">Tasks <span class="count" id="count-tasks"></span></button>
      <button class="tab" role="tab" id="tab-history" aria-selected="false">History <span class="count" id="count-history"></span></button>
    </nav>

    <aside id="settings" class="settings" hidden aria-label="Settings"></aside>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="levelup" class="levelup" hidden></div>

  <script src="../src/core.js"></script>
  <script src="mock-api.js"></script>
  <script src="fx.js"></script>
  <script src="app.js"></script>
</body>
</html>
